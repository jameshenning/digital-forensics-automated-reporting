version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: dfars-postgres
    environment:
      POSTGRES_USER: dfars
      POSTGRES_PASSWORD: dfars
      POSTGRES_DB: dfars
    ports:
      - "5432:5432"
    volumes:
      - dfars_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dfars -d dfars"]
      interval: 5s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.0.0
    container_name: dfars-grafana
    ports:
      - "127.0.0.1:3099:3000"
    volumes:
      - dfars_grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SERVER_ROOT_URL=http://localhost:3099
      - GF_INSTALL_PLUGINS=marcusolsson-json-datasource
    depends_on:
      - postgres

  ollama:
    image: ollama/ollama:latest
    container_name: dfars-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - dfars_ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:11434/api/tags >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  dfars_pg_data:
  dfars_grafana_data:
  dfars_ollama_data:
