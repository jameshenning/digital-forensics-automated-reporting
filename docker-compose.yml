version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: dfars-postgres
    environment:
      POSTGRES_USER: dfars
      POSTGRES_PASSWORD: dfars
      POSTGRES_DB: dfars
    ports:
      - "5432:5432"
    volumes:
      - dfars_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dfars -d dfars"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  dfars_pg_data:
